  # ════════════════════════════════════════════════════════════════════════════
  # STUDENT ROUTES
  # ════════════════════════════════════════════════════════════════════════════

  /api/student/dashboard:
    get:
      tags: [Student]
      summary: Get student dashboard
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Student dashboard data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentDashboard'
        '404':
          description: Student not found

  /api/student/profile:
    get:
      tags: [Student]
      summary: Get student profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Student profile details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfile'
        '404':
          description: Student not found
    put:
      tags: [Student]
      summary: Update student profile
      description: "Updatable fields: fname, lname, dob, phone, cgpa, skill_ids"
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fname:
                  type: string
                lname:
                  type: string
                dob:
                  type: string
                  format: date
                phone:
                  type: string
                cgpa:
                  type: number
                skill_ids:
                  type: array
                  items:
                    type: integer
      responses:
        '200':
          description: Profile updated
        '400':
          description: Invalid date format
        '404':
          description: Student not found

  /api/student/resume:
    post:
      tags: [Student]
      summary: Upload resume
      description: "Allowed extensions: pdf, doc, docx. Max size: 5MB."
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [resume]
              properties:
                resume:
                  type: string
                  format: binary
      responses:
        '200':
          description: Resume uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  filename:
                    type: string
        '400':
          description: No file or invalid extension
        '413':
          description: File too large
    get:
      tags: [Student]
      summary: Download resume
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Resume file download
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          description: Resume not found

  /api/student/drives:
    get:
      tags: [Student]
      summary: List eligible drives
      description: |
        Returns approved drives with future deadlines, filtered by year constraints:
        - Year 3: only `2M Internship` drives
        - Year 4: all drives except `2M Internship`
      security:
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Search by job title
        - name: location
          in: query
          schema:
            type: string
        - name: drive_type
          in: query
          schema:
            type: string
        - name: min_salary
          in: query
          schema:
            type: number
        - name: application_status
          in: query
          schema:
            type: string
            enum: [Applied, Shortlisted, Selected for Next Round, Selected, Rejected, Withdrawn, Not Applied]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated list of eligible drives with application status
        '404':
          description: Student not found

  /api/student/drives/{drive_id}:
    get:
      tags: [Student]
      summary: Get drive details (student view)
      description: Returns drive info including whether the student has already applied.
      security:
        - BearerAuth: []
      parameters:
        - name: drive_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Drive details with application status
        '404':
          description: Drive not found or not approved

  /api/student/drives/{drive_id}/apply:
    post:
      tags: [Student]
      summary: Apply for a drive
      description: |
        Business rules enforced:
        - Drive must be `Approved` with a future deadline
        - Student CGPA ≥ drive CGPA requirement
        - Year 3 → only `2M Internship`; Year 4 → cannot apply to `2M Internship`
        - Student branch must be in eligible branches
        - Already placed students cannot apply
        - No duplicate applications
      security:
        - BearerAuth: []
      parameters:
        - name: drive_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: Application submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  application_id:
                    type: integer
        '400':
          description: Deadline passed or CGPA too low
        '403':
          description: Not eligible (wrong year, branch, or already placed)
        '409':
          description: Already applied

  /api/student/applications:
    get:
      tags: [Student]
      summary: List student's applications
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated list of student's applications
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginationParams'
                  - type: object
                    properties:
                      applications:
                        type: array
                        items:
                          $ref: '#/components/schemas/ApplicationSummary'

  /api/student/applications/{app_id}:
    get:
      tags: [Student]
      summary: Get application details
      security:
        - BearerAuth: []
      parameters:
        - name: app_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Application details including current interview round
        '403':
          description: Application not found or not owned

  /api/student/applications/{app_id}/withdraw:
    put:
      tags: [Student]
      summary: Withdraw an application
      description: "Can only withdraw if status is `Applied` or `Shortlisted`."
      security:
        - BearerAuth: []
      parameters:
        - name: app_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Application withdrawn
        '400':
          description: Cannot withdraw (progressed beyond initial stages)
        '403':
          description: Application not found

  /api/student/placement:
    get:
      tags: [Student]
      summary: Get student's placement record
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Placement details
          content:
            application/json:
              schema:
                type: object
                properties:
                  placement:
                    $ref: '#/components/schemas/PlacementRecord'
        '404':
          description: No placement found

  /api/student/export/applications:
    post:
      tags: [Student]
      summary: Export applications as CSV
      description: "Triggers an async Celery task. CSV is emailed to the student's university email."
      security:
        - BearerAuth: []
      responses:
        '202':
          description: Export started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'

  # ════════════════════════════════════════════════════════════════════════════
  # COMPANY ROUTES
  # ════════════════════════════════════════════════════════════════════════════

  /api/company/dashboard:
    get:
      tags: [Company]
      summary: Get company dashboard
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Company dashboard data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyDashboard'
        '404':
          description: Company not found

  /api/company/profile:
    get:
      tags: [Company]
      summary: Get company profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Company profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyProfile'
        '404':
          description: Company not found
    put:
      tags: [Company]
      summary: Update company profile
      description: |
        Updatable: company_name, industry, website, location, description, hr_name, hr_email, hr_phone.
        **Note:** Changing `hr_email` resets company status to `Pending` and triggers logout.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                company_name:
                  type: string
                industry:
                  type: string
                website:
                  type: string
                location:
                  type: string
                description:
                  type: string
                hr_name:
                  type: string
                hr_email:
                  type: string
                hr_phone:
                  type: string
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  logout:
                    type: boolean
                    description: "true if hr_email was changed, requiring re-approval"

  /api/company/drives:
    get:
      tags: [Company]
      summary: List company's drives
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Paginated list of drives
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginationParams'
                  - type: object
                    properties:
                      drives:
                        type: array
                        items:
                          $ref: '#/components/schemas/DriveSummary'
    post:
      tags: [Company]
      summary: Create a placement drive
      description: "Only approved companies can create drives. Drive starts in `Pending` status."
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriveCreate'
      responses:
        '201':
          description: Drive created, awaiting approval
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  drive_id:
                    type: integer
                  drive_type:
                    type: string
        '400':
          description: Invalid drive type or date format
        '403':
          description: Company not approved

  /api/company/drives/{drive_id}:
    get:
      tags: [Company]
      summary: Get drive details
      security:
        - BearerAuth: []
      parameters:
        - name: drive_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Full drive details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriveDetail'
        '403':
          description: Access denied
        '404':
          description: Drive not found
    put:
      tags: [Company]
      summary: Update a drive
      description: |
        Only `Pending` or `Approved` (pre-deadline) drives can be updated.
        Updating resets status to `Pending` and marks all existing applications as `Inactive`.
      security:
        - BearerAuth: []
      parameters:
        - name: drive_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                job_title:
                  type: string
                job_desc:
                  type: string
                drive_type:
                  type: string
                cgpa_requirement:
                  type: number
                salary_min:
                  type: number
                salary_max:
                  type: number
                location:
                  type: string
                application_deadline:
                  type: string
                  format: date-time
                eligible_branch_ids:
                  type: array
                  items:
                    type: integer
                skill_ids:
                  type: array
                  items:
                    type: integer
      responses:
        '200':
          description: Drive updated, re-approval required
        '400':
          description: Drive already begun or invalid type/date
        '403':
          description: Access denied

  /api/company/drives/{drive_id}/close:
    put:
      tags: [Company]
      summary: Close a drive
      security:
        - BearerAuth: []
      parameters:
        - name: drive_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Drive closed
        '403':
          description: Access denied

  /api/company/drives/{drive_id}/applications:
    get:
      tags: [Company]
      summary: List applications for a drive
      security:
        - BearerAuth: []
      parameters:
        - name: drive_id
          in: path
          required: true
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Paginated list of applications for this drive
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginationParams'
                  - type: object
                    properties:
                      applications:
                        type: array
                        items:
                          type: object
                          properties:
                            application_id:
                              type: integer
                            register_no:
                              type: string
                            student_name:
                              type: string
                            cgpa:
                              type: number
                            applied_date:
                              type: string
                            application_status:
                              type: string
                            current_round:
                              type: string
                              nullable: true
                            feedback:
                              type: string
                              nullable: true
        '403':
          description: Access denied

  /api/company/applications/{app_id}/status:
    put:
      tags: [Company]
      summary: Update application status
      description: |
        Valid actions: `Shortlisted`, `Selected for Next Round`, `Selected`, `Rejected`.
        
        **Special behaviors:**
        - `Selected for Next Round`: auto-advances to the next interview round. If no next round exists, auto-promotes to `Selected`.
        - `Selected`: creates a Placement record and auto-withdraws the student's other active applications.
        - `Selected` requires a `joining_date` field.
        
        An email notification is sent to the student for each status change.
      security:
        - BearerAuth: []
      parameters:
        - name: app_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationStatusUpdate'
      responses:
        '200':
          description: Application status updated
        '400':
          description: Invalid action or missing joining_date
        '403':
          description: Access denied
        '404':
          description: Application not found

  # ── Interview Management ──

  /api/company/drives/{drive_id}/interviews:
    get:
      tags: [Company]
      summary: List interviews for a drive
      security:
        - BearerAuth: []
      parameters:
        - name: drive_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of interview rounds
          content:
            application/json:
              schema:
                type: object
                properties:
                  interviews:
                    type: array
                    items:
                      $ref: '#/components/schemas/InterviewDetail'
        '403':
          description: Access denied
    post:
      tags: [Company]
      summary: Schedule an interview round
      description: Round number is auto-incremented.
      security:
        - BearerAuth: []
      parameters:
        - name: drive_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterviewCreate'
      responses:
        '201':
          description: Interview scheduled
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  interview_id:
                    type: integer
                  round_number:
                    type: integer
        '400':
          description: Invalid date format
        '403':
          description: Access denied

  /api/company/interviews/{interview_id}:
    put:
      tags: [Company]
      summary: Update an interview round
      security:
        - BearerAuth: []
      parameters:
        - name: interview_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                round_title:
                  type: string
                interview_date:
                  type: string
                  format: date-time
                location:
                  type: string
      responses:
        '200':
          description: Interview updated
        '400':
          description: Invalid date format
        '403':
          description: Access denied
        '404':
          description: Interview not found

